<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Aymen Nasri. Cloud security, SOC automation and DevSecOps. Cybersecurity engineering student at TEK-UP, class of 2027. Certified CKA, AWS Solutions Architect Associate, RHCE, RHCSA and eJPTv2.">
  <style>
    .k{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:3px;fill:#3fd0c9}
    .n{font:700 66px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#ffffff;letter-spacing:-1px}
    .s{font:400 19px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9fb3c8}
    .t{font:600 21px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf5}
    .loc{font:400 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8fa3b8}
    .pt{font:700 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#ffd23f}
    .m{font:14.5px Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace}
    .tt{font:12px Consolas,'SF Mono',Menlo,monospace;fill:#7f93ab}
    .p{fill:#3fd0c9}.c{fill:#e6edf5}.o{fill:#9fb3c8}.y{fill:#ffd23f}
    .r{animation:show .45s ease-out both}
    .d1{animation-delay:.5s}.d2{animation-delay:1.1s}.d3{animation-delay:1.8s}.d4{animation-delay:2.4s}
    .d5{animation-delay:3.1s}.d6{animation-delay:3.7s}.d7{animation-delay:4.4s}.d8{animation-delay:5s}.d9{animation-delay:5.6s}
    .cur{animation:blink 1.05s steps(1) infinite}
    @keyframes show{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.r,.cur{animation:none}}
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#14273f" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.75"><stop offset="0" stop-color="#3fd0c9" stop-opacity="0.16"/><stop offset="1" stop-color="#3fd0c9" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fd0c9"/><stop offset="0.55" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
  </defs>
  <rect width="1200" height="380" rx="18" fill="#0b1626"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)" opacity="0.7"/>
  <rect width="1200" height="380" rx="18" fill="url(#glow)"/>
  <rect x="0" y="374" width="1200" height="6" fill="url(#edge)"/>

  <text class="k" x="56" y="92">CLOUD SECURITY · SOC AUTOMATION · DEVSECOPS</text>
  <text class="n" x="52" y="168">Aymen Nasri</text>
  <text class="s" x="56" y="208">Cybersecurity engineering student · TEK-UP, class of 2027</text>
  <text class="t" x="56" y="250">I build detection and response that is safe to automate.</text>

  <g transform="translate(56,274)">
    <rect width="54" height="28" rx="14" fill="none" stroke="#ffd23f" stroke-width="1.5"/><text class="pt" x="27" y="19" text-anchor="middle">CKA</text>
    <rect x="64" width="86" height="28" rx="14" fill="none" stroke="#ffd23f" stroke-width="1.5"/><text class="pt" x="107" y="19" text-anchor="middle">AWS SAA</text>
    <rect x="160" width="62" height="28" rx="14" fill="none" stroke="#ffd23f" stroke-width="1.5"/><text class="pt" x="191" y="19" text-anchor="middle">RHCE</text>
    <rect x="232" width="72" height="28" rx="14" fill="none" stroke="#ffd23f" stroke-width="1.5"/><text class="pt" x="268" y="19" text-anchor="middle">RHCSA</text>
    <rect x="314" width="72" height="28" rx="14" fill="none" stroke="#ffd23f" stroke-width="1.5"/><text class="pt" x="350" y="19" text-anchor="middle">eJPTv2</text>
  </g>
  <text class="loc" x="56" y="340">Monastir, Tunisia · open to Europe, remote or Tunisia</text>

  <g transform="translate(652,46)">
    <rect width="500" height="312" rx="12" fill="#0f1c2d" stroke="#26405f" stroke-width="1.5"/>
    <path d="M12,0 H488 A12,12 0 0 1 500,12 V34 H0 V12 A12,12 0 0 1 12,0 Z" fill="#13243a"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
    <text class="tt" x="250" y="21" text-anchor="middle">aymen@shield: ~</text>
    <g class="m">
      <text class="r d1" x="22" y="66"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text>
      <text class="r d2 o" x="22" y="92">aymen-nasri · cloud &amp; security engineer in training</text>
      <text class="r d3" x="22" y="124"><tspan class="p">$ </tspan><tspan class="c">kubectl get certifications</tspan></text>
      <text class="r d4 y" x="22" y="150">CKA  AWS-SAA  RHCE  RHCSA  eJPTv2</text>
      <text class="r d5" x="22" y="182"><tspan class="p">$ </tspan><tspan class="c">ls ~/projects</tspan></text>
      <text class="r d6 c" x="22" y="208">cloudshield/  blindspot/  soc-automation-lab/</text>
      <text class="r d7" x="22" y="240"><tspan class="p">$ </tspan><tspan class="c">cat ~/.motto</tspan></text>
      <text class="r d8 p" x="22" y="266">AI suggests. Policy decides. Humans approve.</text>
    </g>
    <g class="r d9"><text class="m p" x="22" y="296">$</text><rect class="cur" x="40" y="284" width="9" height="15" fill="#3fd0c9"/></g>
  </g>
</svg>
